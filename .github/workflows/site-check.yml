# Installed by proj-site's site-init.sh. Fails a PR that adds no per-PR entry,
# or that leaves a due weekly summary missing (see the site-writing skill).
name: Site check
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check per-PR entry and weekly summary
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_TILE: .tessl/plugins/mhclg-aaai/proj-site
        run: >-
          bash "$SITE_TILE/scripts/check-pr.sh"
          --base "origin/${{ github.base_ref }}"
          --head HEAD
          --pr "${{ github.event.pull_request.number }}"
          --repo "${{ github.repository }}"
